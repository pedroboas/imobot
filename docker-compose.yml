services:
  # Scraper service: Orchestrates the scraping logic
  scraper:
    build: .
    restart: always
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - BROWSER_WS_ENDPOINT=${BROWSER_WS_ENDPOINT:-ws://browser:3000}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL}
    depends_on:
      - db
      - browser

  # O Browser: Instância isolada para contornar o Cloudflare
  browser:
    image: ghcr.io/browserless/chromium:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      - TIMEOUT=120000
      - CONCURRENT=3
      - QUEUED=5
      - HEALTH=true

  # A Base de Dados: Para não enviar anúncios repetidos
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: imoveis
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Dashboard: Monitoring UI
  dashboard:
    build: .
    restart: always
    command: python dashboard/app.py
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SESSION_SECRET=${SESSION_SECRET:-imobot_secure_session_token}
      - PYTHONPATH=/app
    depends_on:
      - db
      - scraper

volumes:
  postgres_data: